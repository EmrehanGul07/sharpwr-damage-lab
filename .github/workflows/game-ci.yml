name: Game CI
# Fast tier for the MOBA workspace (docs/moba/06-testing.md). The Python Damage Lab keeps its
# own checks; this workflow only reads it (parity fixtures are regenerated and compared).
on:
  push:
    paths: ["game/**", "tools/**", ".claude/**", "docs/moba/**", "CLAUDE.md", "sharpwr/**", "data/**", ".github/workflows/game-ci.yml"]
  pull_request:
    paths: ["game/**", "tools/**", ".claude/**", "docs/moba/**", "CLAUDE.md", "sharpwr/**", "data/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Fast checks (lint, content, ownership, parity fixtures, C# sim tests)
        shell: bash
        run: |
          set -o pipefail
          python -I tools/ci/fast_checks.py 2>&1 | tee fast.log
      - name: Report fast-check failures as annotations
        if: failure()
        shell: bash
        run: |
          python -I tools/ci/annotate_failures.py fast.log
          grep -E "^\[FAIL\]" fast.log | head -5 | sed 's/^/::error title=fast check::/' || true
  sim-cross-platform:
    # Same tests on ARM64 and x64 runners: determinism is a cross-platform property.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: C# sim tests (must execute at least MIN_SIM_TESTS)
        env: { MIN_SIM_TESTS: "40" }
        shell: bash
        run: |
          set -o pipefail
          dotnet test game/sim/tests/SharpWR.Sim.Tests.csproj --nologo --logger "trx;LogFileName=sim.trx" --results-directory TestResults 2>&1 | tee build.log
          python -I tools/ci/check_trx.py TestResults/sim.trx --min ${{ env.MIN_SIM_TESTS }}
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python -I tools/ci/annotate_failures.py build.log TestResults/sim.trx
  # unity-build: added in milestone M1 (needs UNITY_LICENSE secrets; see docs/moba/06-testing.md)

name: Build Android preview
# Tests and builds the mobile Database app, then packs the Android preview APK and
# the live update (the web screens as a zip, plus sharpwr-web.json, which installed
# apps read). Every run uploads the APK as an artifact; runs on main also publish
# all three to the mobile-preview release, whose APK link stays the same.
on:
  push:
    paths:
      - "mobile/**"
      - "tests/test_duel_bot.cjs"
      - "tests/test_duel_mechanics.cjs"
      - "tests/test_dragon_lane.cjs"
      - "app-data/**"
      - "assets/riot/**"
      # The Practice tab runs the web Practice Tool scripts.
      - "assets/marksman-3d/*.js"
      - "assets/marksman-3d/practice-tool.css"
      - "assets/combat_replay.html"
      - "assets/replay_state.js"
      - "combat_replay.py"
      - "sharpwr/**"
      - "data/*.json"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      APK: sharpwr-database-preview.apk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npm test
      - name: Check 1v1 bot fairness and moving collision
        working-directory: .
        run: |
          node tests/test_duel_bot.cjs
          node tests/test_duel_mechanics.cjs
          node tests/test_dragon_lane.cjs
      - name: Build the web app
        env:
          # GitHub preview builds take live updates from the mobile-preview release and
          # offer a new APK when the Android shell changed. A Google Play build must not
          # set this: Play updates the APK itself, and needs its own live-update channel.
          VITE_PREVIEW_BUILD: "1"
        run: npm run build
      - name: Pack the live update
        run: |
          version=$(node -p "require('./package.json').version")
          zip_name="sharpwr-web-$version.zip"
          (cd dist && zip -qrX "../$zip_name" .)
          unzip -l "$zip_name" | grep -q " index.html$"
          checksum=$(sha256sum "$zip_name" | cut -d" " -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/mobile-preview/$zip_name"
          node -e '
            const [version, url, checksum] = process.argv.slice(1);
            const { minApkVersion } = require("./native.json");
            console.log(JSON.stringify({ version, minApkVersion, url, checksum }, null, 2));
          ' "$version" "$url" "$checksum" > sharpwr-web.json
          echo "WEB_ZIP=$zip_name" >> "$GITHUB_ENV"
          echo "Live update $(du -h "$zip_name" | cut -f1):" && cat sharpwr-web.json
      - name: Check offline fight and 3D replay in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - run: npx cap sync android
      - name: Build preview APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
      - name: Check the APK contents
        run: |
          unzip -l "$APK" > apk-contents.txt
          grep -q "assets/public/index.html" apk-contents.txt
          grep -q "assets/public/data/database.json" apk-contents.txt
          grep -q "assets/public/engine/pyodide.asm.wasm" apk-contents.txt
          grep -q "assets/public/engine/sources.json" apk-contents.txt
          models=$(grep -c "assets/public/assets/models/.*/character.glb" apk-contents.txt)
          test "$models" -eq 23
          icons=$(grep -c "assets/public/assets/riot/.*\.\(png\|webp\|jpg\)$" apk-contents.txt)
          echo "APK size: $(du -h "$APK" | cut -f1), bundled icons: $icons"
          test "$icons" -ge 128
      - uses: actions/upload-artifact@v4
        with:
          name: sharpwr-android-preview
          path: |
            mobile/${{ env.APK }}
            mobile/${{ env.WEB_ZIP }}
            mobile/sharpwr-web.json
      - name: Publish to the mobile-preview release
        if: github.ref == 'refs/heads/main'
        run: |
          if ! gh release view mobile-preview >/dev/null 2>&1; then
            gh release create mobile-preview --target main --prerelease \
              --title "SharpWR Android preview" \
              --notes "Preview build of the SharpWR Database app for testing on Android. Each new build installs over the previous one. Free fan project, not endorsed by Riot Games."
          fi
          gh release upload mobile-preview "$APK" "$WEB_ZIP" --clobber
          # The manifest goes last, so it never points at a zip that is not uploaded yet.
          gh release upload mobile-preview sharpwr-web.json --clobber
          # Keep the three newest screen zips; installed apps only download the current one.
          gh release view mobile-preview --json assets \
            --jq '[.assets[] | select(.name | startswith("sharpwr-web-") and endswith(".zip"))] | sort_by(.createdAt) | reverse | .[3:] | .[].name' |
            while read -r name; do gh release delete-asset mobile-preview "$name" --yes; done

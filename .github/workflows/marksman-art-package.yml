name: Verify and export marksman art
on:
  push:
    branches: [main]
    paths:
      - "assets/marksman-3d/*.js"
      - "data/marksman-art-direction.json"
      - "scripts/export_marksman_art.mjs"
      - "scripts/package_marksman_art.py"
      - "tests/test_marksman_art*"
      - ".github/workflows/marksman-art-package.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run export:art
      - run: npm run test:art
      - run: node tests/test_marksman_fight.cjs
      - run: node tests/test_replay_state.cjs
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: sharpwr-marksman-art-v1
          path: assets/marksman-3d/sharpwr-marksman-art-v1.zip
      - name: Save verified generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marksman-3d/models data/marksman-3d-assets.json assets/marksman-3d/sharpwr-marksman-art-v1.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate verified marksman GLBs and download package"
          git push

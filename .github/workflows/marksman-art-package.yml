name: Verify and export marksman art
on:
  push:
    branches: [main]
    paths:
      - "assets/marksman-3d/*.js"
      - "data/marksman-art-direction.json"
      - "data/marksman-skill-icons.json"
      - "assets/marksman-3d/studio.html"
      - "marksman_art.py"
      - "tests/test_combat_hud.cjs"
      - "scripts/export_marksman_art.mjs"
      - "scripts/package_marksman_art.py"
      - "scripts/build_ezreal_study.py"
      - "tests/test_blender_study.cjs"
      - "tests/test_marksman_art*"
      - ".github/workflows/marksman-art-package.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run export:art
      - name: Build Blender study when source changes
        run: |
          if python -c "import hashlib,json,pathlib; p=pathlib.Path('assets/marksman-3d/studies/ezreal-v2/manifest.json'); assert p.exists() and json.loads(p.read_text()).get('source_sha256') == hashlib.sha256(pathlib.Path('scripts/build_ezreal_study.py').read_bytes()).hexdigest()"; then exit 0; fi
          curl -L --fail --retry 2 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.5.14-linux-x64/blender --background --threads 2 --python scripts/build_ezreal_study.py
      - run: node tests/test_blender_study.cjs
      - run: npm run test:art
      - run: node tests/test_marksman_fight.cjs
      - run: node tests/test_combat_hud.cjs
      - run: node tests/test_replay_state.cjs
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: sharpwr-marksman-art-v1
          path: assets/marksman-3d/sharpwr-marksman-art-v1.zip
      - name: Save verified generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marksman-3d/models data/marksman-3d-assets.json assets/marksman-3d/sharpwr-marksman-art-v1.zip assets/marksman-3d/studies/ezreal-v2 docs/art-review
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate verified marksman GLBs and download package"
          git push

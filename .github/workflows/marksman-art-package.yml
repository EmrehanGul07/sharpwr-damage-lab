name: Verify and export marksman art
on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "README.md"
      - "tests/test_version.py"
      - "assets/marksman-3d/*.js"
      - "assets/marksman-3d/practice-tool.*"
      - "sharpwr/practice_data.py"
      - "app-data/practice.json"
      - "tests/test_practice_tool.cjs"
      - "tests/test_dragon_lane.cjs"
      - "tests/test_practice_data.py"
      - "data/marksman-art-direction.json"
      - "data/riot/marksman-skill-icons.json"
      - "assets/marksman-3d/studio.html"
      - "marksman_art.py"
      - "tests/test_combat_hud.cjs"
      - "tests/test_visual_v6.cjs"
      - "scripts/export_marksman_art.mjs"
      - "scripts/package_marksman_art.py"
      - "scripts/build_ezreal_study.py"
      - "scripts/marksman_v2/**"
      - "scripts/build_skill_geometry.py"
      - "scripts/check_art_sources.py"
      - "data/marksman-skill-geometry.json"
      - "tests/test_roster_v7.cjs"
      - "tests/test_blender_study.cjs"
      - "tests/test_marksman_art*"
      - ".github/workflows/marksman-art-package.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  # Editable Blender sources and download packages are release assets, not tracked files.
  RELEASE_TAG: art-sources
  BLENDER_URL: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run export:art
      - name: Decide whether the Blender sources must be rebuilt
        id: blender
        run: |
          rebuild=false
          python scripts/check_art_sources.py || rebuild=true
          published=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          for asset in sharpwr-skinned-roster-v8.zip sharpwr-ezreal-v2-source.zip; do
            if ! grep -qx "$asset" <<<"$published"; then
              echo "Release asset missing: $asset"
              rebuild=true
            fi
          done
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
      - name: Build Ezreal study and skinned roster
        if: steps.blender.outputs.rebuild == 'true'
        run: |
          curl -L --fail --retry 2 -o /tmp/blender.tar.xz "$BLENDER_URL"
          tar -xf /tmp/blender.tar.xz -C /tmp
          blender=/tmp/blender-4.5.14-linux-x64/blender
          "$blender" --background --threads 2 --python scripts/build_ezreal_study.py
          # v2 studies: one Blender process per champion, four at a time.
          python scripts/marksman_v2/export_studio.py --blender "$blender" --jobs 4
          python scripts/check_art_sources.py
      - run: node tests/test_blender_study.cjs
      - run: node tests/test_roster_v7.cjs
      - run: npm run test:art
      - run: node tests/test_marksman_fight.cjs
      - run: node tests/test_combat_hud.cjs
      - run: node tests/test_visual_v6.cjs
      - run: node tests/test_replay_state.cjs
      - run: pip install -r requirements.txt
      - run: node tests/test_practice_tool.cjs
      - run: node tests/test_duel_bot.cjs
      - run: node tests/test_duel_mechanics.cjs
      - run: node tests/test_lane_training.cjs
      - run: node tests/test_lane_multihit.cjs
      - run: node tests/test_dragon_lane.cjs
      - run: python -m unittest discover -s tests -q
      - name: Publish download packages to the release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "${{ github.event.repository.default_branch }}" --latest=false \
              --title "SharpWR 3D sources" \
              --notes "Editable Blender sources and download packages for the SharpWR Animation Studio, rebuilt by the art workflow. Original stylized artwork; not extracted game assets."
          fi
          gh release upload "$RELEASE_TAG" build/release/*.zip --clobber
      - name: Save verified generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marksman-3d/models data/marksman-3d-assets.json static/marksman-3d assets/marksman-3d/studies/ezreal-v2 docs/art-review
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate verified marksman GLBs"
          git push

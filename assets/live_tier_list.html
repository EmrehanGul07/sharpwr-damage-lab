<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#080e17;color:#e4eaf2;font:14px system-ui}.wrap{padding:20px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{margin:0;color:#eed597;font-size:28px;letter-spacing:1px}small{color:#8e9eb2}.controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}button,input{background:#162235;border:1px solid #34465f;color:#e4eaf2;border-radius:7px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:#e6c67e}.row{display:flex;min-height:90px;border:1px solid #29374a;border-bottom:0;background:#101927}.row:last-child{border-bottom:1px solid #29374a}.label{width:90px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;color:#17202b}.drop{display:flex;flex:1;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;min-height:90px}.drop.over{background:#27384e}.item{width:64px;height:64px;padding:0;border:2px solid #65748b;border-radius:6px;position:relative;background:#131e30;cursor:grab}.item img{width:100%;height:100%;border-radius:4px;pointer-events:none}.item.selected{border-color:#ffdf86;box-shadow:0 0 0 3px #ffdf8640}.item:hover:after{content:attr(data-name);position:absolute;z-index:10;bottom:70px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#050b14;padding:8px;border:1px solid #9f8651;border-radius:5px;font:12px system-ui}.pool{margin-top:18px;background:#0d1725;border:1px solid #29374a;border-radius:8px}.pool .drop{min-height:110px}h2{font-size:13px;color:#90a1b9;margin:14px 14px 0;letter-spacing:2px}.note{color:#8e9eb2;font-size:12px;margin:12px 0}.record .controls,.record .note,.record .pool h2{display:none}.record header{margin-bottom:14px}.record .pool{border:0;background:transparent}.record .item:hover:after{display:none}.restore{display:none}.record .restore{display:block;opacity:.25}.record .restore:hover{opacity:1}@media(max-width:600px){.wrap{padding:8px}.item{width:48px;height:48px}.label{width:55px}.drop{gap:6px}h1{font-size:20px}}
</style></head><body><div class="wrap"><header><div><small>SHARPWR · PATCH 7.3a</small><h1 contenteditable="true" aria-label="Tier list title">ADC ITEM TIER LIST</h1></div><button class="restore" id="restore">Edit mode</button></header><div class="controls"><button id="record">Recording view</button><button id="undo">Undo</button><button id="export">Save JSON</button><button id="reset">Reset board</button><input id="search" placeholder="Search items" aria-label="Search items"></div><p class="note" id="status">Drag items to a tier, or select an item then click a tier. Double-click an item to return it to the pool. Your board saves automatically in this browser.</p><div id="board"></div><div class="pool"><h2>UNRANKED ITEMS</h2><div class="drop" data-tier="pool" id="pool"></div></div></div><script>
const items=__ITEMS__,tiers=['S','A','B','C','D','F'],colors=['#f48c89','#f7b083','#f3d184','#91cdab','#86b9df','#ad9ed7'],all=items.map(i=>i.name);
let state={};try{state=JSON.parse(localStorage.getItem('sharpwr-live-tier-v1'))||{};}catch(e){}
const seen=new Set;for(const t of [...tiers,'pool'])state[t]=(Array.isArray(state[t])?state[t]:[]).filter(n=>all.includes(n)&&!seen.has(n)&&seen.add(n));state.pool.push(...all.filter(n=>!seen.has(n)));
document.querySelector('h1').removeAttribute('contenteditable');
document.getElementById('restore').remove();
for(const id of ['record','undo','reset','search'])document.getElementById(id).remove();
document.getElementById('status').textContent=tiers.some(t=>state[t].length)?'Read-only tier list · Editing is disabled. Your saved board has been preserved.':'The published video tier list will appear here once the final creator ranking is available.';
function fill(zone,t){for(const name of state[t]){const item=items.find(i=>i.name===name),b=document.createElement('div');b.className='item';b.style.cursor='default';b.title=name;b.setAttribute('aria-label',name);const img=document.createElement('img');img.src=item.icon;img.alt=name;b.append(img);zone.append(b);}}
for(const [i,t]of tiers.entries()){const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.className='label';label.textContent=t;label.style.background=colors[i];const zone=document.createElement('div');zone.className='drop';zone.dataset.tier=t;row.append(label,zone);document.getElementById('board').append(row);fill(zone,t);}
fill(document.getElementById('pool'),'pool');
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({title:document.querySelector('h1').textContent,tiers:state},null,2)],{type:'application/json'}));a.download='sharpwr-live-tier-list.json';a.click();URL.revokeObjectURL(a.href);};
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui;color:#dfe9f5;background:#09121f}button,select{border:1px solid #38506b;border-radius:8px;background:#15263b;color:#e5eef8;padding:8px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e4c471}button:hover{background:#263b54}.wrap{padding:14px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.gold{color:#edd18a}.muted{color:#90a5bd;font-size:11px;line-height:1.5}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#seek{flex:1;min-width:120px;accent-color:#e4c471}canvas{display:block;width:100%;height:290px;background:#0e1c2c;border:1px solid #2b4057;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{background:#101e30;border:1px solid #2b4057;border-radius:10px;padding:12px;min-width:0}.stats{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.bar{height:10px;background:#28364b;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#ee686e}.lanes{margin-top:12px}.lane{display:flex;align-items:center;gap:8px;margin:5px 0}.lane>span{width:65px;color:#9bb0c6}.track{height:24px;flex:1;position:relative;background:#17273b;border-radius:5px;cursor:pointer}.mark{position:absolute;top:2px;height:20px;min-width:3px;border:0;border-radius:3px;padding:0;background:#7ac7e1}.mark.skill{background:#b791eb}.mark.item{background:#ebc776}.cursor{position:absolute;top:0;bottom:0;width:2px;background:white;pointer-events:none}#detail{max-height:190px;overflow:auto;font-size:12px;line-height:1.6}#events{height:164px;overflow:auto}.event{width:100%;text-align:left;margin:3px 0;padding:5px 8px;font-size:11px}.event.selected{border-color:#edcf83;background:#35405b}#meta{overflow-wrap:anywhere}details{margin-top:10px}#rules{white-space:pre-wrap;max-height:130px;overflow:auto}@media(max-width:560px){.grid{grid-template-columns:1fr}canvas{height:250px}.top{align-items:flex-start}}
</style></head><body><div class="wrap"><div class="top"><div><b class="gold" id="title"></b><div class="muted" id="meta"></div></div><b id="clock">0.000s</b></div><div class="controls"><button id="play">▶ Play</button><button id="prev" title="Previous event">◀ Event</button><button id="next" title="Next event">Event ▶</button><button id="reset">↺</button><select id="speed" aria-label="Playback speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><input type="range" id="seek" min="0" step=".001" value="0" aria-label="Fight time"></div><canvas id="arena" aria-label="Representative combat replay"></canvas><div class="stats"><span id="hp"></span><span id="mana"></span><span id="as"></span><span class="gold" id="locks"></span></div><div class="bar"><div id="hpfill"></div></div><div class="lanes" id="lanes"></div><div class="grid"><div class="panel"><b>Selected event</b><div id="detail">Choose an event to inspect its recorded values.</div></div><div class="panel"><b>Engine events · click to seek</b><div id="events"></div></div></div><details><summary>Build, policy & model notes</summary><div id="rules" class="muted"></div></details><p class="muted" id="notice"></p></div><script>
'use strict';const D=__REPLAY_DATA__, $=id=>document.getElementById(id), canvas=$('arena'),ctx=canvas.getContext('2d');let now=0,playing=false,selected=-1,last=0,shown=-2;
const fmt=(v,n=2)=>typeof v==='number'?v.toFixed(n):'—';$('title').textContent=D.champion+' · Level '+D.level+' vs '+D.target;$('meta').textContent='Top build replay · '+(D.ttk===null?'Target survived':fmt(D.ttk,3)+'s TTK');$('notice').textContent=D.notice;$('rules').textContent=D.build.join(' · ')+'\n'+JSON.stringify(D.policy,null,2)+'\n'+D.assumptions.join('\n');$('seek').max=D.duration;
function latest(list,t){let lo=0,hi=list.length;while(lo<hi){let m=(lo+hi)>>1;if(list[m].time<=t+1e-9)lo=m+1;else hi=m;}return lo-1;}
function pos(t){let i=latest(D.motion,t);if(i<0)return{distance:D.attacks[0]?.distance||550,kite_arc:0,attack_range:D.attacks[0]?.attack_range||550};let a=D.motion[i],b=D.motion[i+1];if(!b||b.time<=a.time)return a;let u=Math.min(1,Math.max(0,(t-a.time)/(b.time-a.time)));return{...a,distance:a.distance+(b.distance-a.distance)*u,kite_arc:a.kite_arc+(b.kite_arc-a.kite_arc)*u};}
function seek(t,index=-1){now=Math.max(0,Math.min(D.duration,t));selected=index;playing=false;render();}
$('play').onclick=()=>{if(now>=D.duration)now=0;playing=!playing;selected=-1;render();};$('reset').onclick=()=>seek(0);$('seek').oninput=e=>seek(+e.target.value);$('prev').onclick=()=>{let i=selected>=0?selected-1:latest(D.events,now-.000001);if(i>=0)seek(D.events[i].time,i);};$('next').onclick=()=>{let i=selected>=0?selected+1:latest(D.events,now)+1;if(i<D.events.length)seek(D.events[i].time,i);};
const types=[['AA','attack'],['Skills','skill'],['Item proc','item']];for(const[label,kind]of types){let lane=document.createElement('div');lane.className='lane';let name=document.createElement('span');name.textContent=label;let track=document.createElement('div');track.className='track';track.onclick=e=>{if(e.target===track)seek((e.offsetX/track.clientWidth)*D.duration);};D.events.forEach((e,i)=>{let hit=kind==='attack'?e.phase==='command'&&e.action==='AA':kind==='skill'?e.phase==='command'&&e.action!=='AA':e.phase==='impact'&&((e.damage_components||[]).some(c=>(c.tags||[]).includes('Item'))||(e.effects||[]).some(x=>/Collector|Duskblade|Galeforce|Spellblade|Muramana|Kraken|Rageblade|Hexoptic|Fiendhunter|Statikk|Stormrazor|Rapid Fire|Yun Tal/.test(x)));if(!hit)return;let b=document.createElement('button');b.className='mark '+(kind==='attack'?'':kind);b.style.left=Math.min(99.5,e.time/D.duration*100)+'%';if(e.windup_end)b.style.width=Math.max(.3,(e.windup_end-e.time)/D.duration*100)+'%';b.title='#'+e.event_id+' '+fmt(e.time,3)+'s '+e.action+' '+(e.effects||[]).join(', ');b.onclick=()=>seek(e.time,i);track.appendChild(b);});let cur=document.createElement('div');cur.className='cursor';track.appendChild(cur);lane.append(name,track);$('lanes').appendChild(lane);}
function textLine(parent,label,value){let d=document.createElement('div'),b=document.createElement('b');b.textContent=label+': ';d.append(b,document.createTextNode(String(value)));parent.appendChild(d);}
function inspect(i){if(i===shown)return;shown=i;let el=$('detail');el.replaceChildren();if(i<0){el.textContent='Fight start. No impact yet.';return;}let e=D.events[i];textLine(el,'Event','#'+e.event_id+' · '+fmt(e.time,3)+'s · '+e.action+' · '+e.phase);if(e.phase==='command'){textLine(el,'Range distance',fmt(e.distance));if(e.windup_end){textLine(el,'Windup ends',fmt(e.windup_end,3)+'s');textLine(el,'Impact scheduled',fmt(e.impact_time,3)+'s');}if(e.cost!==undefined)textLine(el,'Mana cost',e.cost);}else{textLine(el,'Damage dealt',fmt(e.damage));textLine(el,'HP',fmt(e.hp_before)+' → '+fmt(e.hp_after));textLine(el,'AD / crit',fmt(e.AD)+' / '+fmt((e.crit_chance||0)*100)+'%');textLine(el,'Effects',(e.effects||[]).join(' · ')||'None');textLine(el,'Stacks after',JSON.stringify(e.after||{}));textLine(el,'Cooldowns at event',JSON.stringify(e.cooldowns||{}));for(const p of e.damage_components||[])textLine(el,'Raw '+p.damage_type,fmt(p.raw_amount)+' · '+(p.tags||[]).join('/')+' · '+(p.component||p.status||p.classification_status||'unknown'));}let list=$('events');list.replaceChildren();let start=Math.max(0,i-5),end=Math.min(D.events.length,start+13);for(let j=start;j<end;j++){let e=D.events[j],b=document.createElement('button');b.className='event'+(j===i?' selected':'');b.textContent='#'+e.event_id+'  '+fmt(e.time,3)+'s  '+e.action+' · '+e.phase+(e.damage!==undefined?' · '+fmt(e.damage)+' damage':'');b.onclick=()=>seek(e.time,j);list.appendChild(b);}}
function circle(x,y,r,color,width=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}function unit(x,y,color,label){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eef4fa';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText(label,x,y+34);}
function render(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;if(canvas.width!==w*dpr||canvas.height!==h*dpr){canvas.width=w*dpr;canvas.height=h*dpr;}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let p=pos(now),scale=Math.min((w*.42)/Math.max(750,p.distance,p.attack_range||550),.18),tx=w*.62,ty=h*.48;let angle=D.champion==='Samira'?0:Math.asin(Math.sin((p.kite_arc||0)/Math.max(1,p.attack_range||550)*3))/3;let cx=tx-p.distance*scale*Math.cos(angle),cy=ty+p.distance*scale*Math.sin(angle);ctx.strokeStyle='#21344b';for(let x=0;x<w;x+=35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}circle(cx,cy,(p.attack_range||550)*scale,'#4c9eb866');unit(tx,ty,'#b95767',D.target.split(' • ').pop());unit(cx-(p.distance<120?25:0),cy,'#69b9d3',D.champion);
let labels=[];for(const[k,label]of [['windup_until','AA WINDUP'],['cast_until','CAST LOCK'],['channel_until','R CHANNEL'],['w_until','W ACTIVE'],['dash_until','DASH']])if(now<(p[k]||0))labels.push(label);
if(labels.includes('W ACTIVE'))circle(cx,cy,40,'#b791eb',3);if(labels.includes('R CHANNEL')){circle(cx,cy,58,'#db9ee8',2);for(let j=0;j<6;j++){let a=now*5+j*Math.PI/3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*54,cy+Math.sin(a)*54);ctx.strokeStyle='#aa79bc88';ctx.stroke();}}
for(const f of D.skill_flights||[]){if(now<f.launch||now>f.impact)continue;let u=(now-f.launch)/(f.impact-f.launch),origin=pos(f.launch),ax=tx-origin.distance*scale;ctx.fillStyle='#b791eb';ctx.fillRect(ax+(tx-ax)*u-4,ty-4,8,8);}
for(const a of D.attacks){if(a.kind!=='attack'||now<a.time||now>a.impact_time)continue;if(now<a.windup_end){circle(cx,cy,22,'#efd38b',3);continue;}let f=(now-a.windup_end)/Math.max(.00001,a.impact_time-a.windup_end),origin=pos(a.windup_end),ax=tx-origin.distance*scale*Math.cos(angle),ay=ty+origin.distance*scale*Math.sin(angle);ctx.fillStyle='#f7d479';ctx.beginPath();ctx.arc(ax+(tx-ax)*f,ay+(ty-ay)*f,4,0,7);ctx.fill();}
const visible=D.events.filter(e=>e.phase==='impact'&&now>=e.time&&now<e.time+.6);visible.forEach((e,i)=>{let age=now-e.time;ctx.globalAlpha=1-age/.6;circle(tx,ty,20+age*45,e.action.startsWith('AA')?'#f6b46c':'#b893f0',2);ctx.fillStyle=e.damage_components?.some(p=>p.damage_type==='true')?'#f5f7fb':e.damage_components?.some(p=>p.damage_type==='magic')?'#80bbff':'#ff9d79';ctx.font='bold 13px system-ui';ctx.fillText(e.action+' '+fmt(e.damage,0),tx,ty-28-age*50-i*17);ctx.globalAlpha=1;});
let idx=selected>=0?selected:latest(D.events,now),past=D.events.slice(0,idx+1),hit=[...past].reverse().find(e=>e.phase==='impact'),resource=[...past].reverse().find(e=>e.mana_after!==undefined||e.mana!==undefined),cd=[...past].reverse().find(e=>e.cooldowns);let hp=hit?.hp_after??D.max_hp;$('hp').textContent='Target HP '+fmt(hp,0)+' / '+fmt(D.max_hp,0);$('hpfill').style.width=Math.max(0,hp/D.max_hp*100)+'%';$('mana').textContent='Mana snapshot '+fmt(resource?.mana_after??resource?.mana,0);$('as').textContent='AS '+fmt(p.attack_speed)+' · Distance '+fmt(p.distance,0);$('locks').textContent=labels.join(' · ')||'No recorded lock';ctx.fillStyle='#a7bad0';ctx.textAlign='left';ctx.font='11px system-ui';ctx.fillText('Range circle · representative kite geometry',12,h-14);if(cd)ctx.fillText('CD '+Object.entries(cd.cooldowns).map(([k,v])=>k+':'+fmt(Math.max(0,v-(now-cd.time)),1)).join('  '),12,18);$('clock').textContent=fmt(now,3)+'s';$('seek').value=now;$('play').textContent=playing?'❚❚ Pause':'▶ Play';document.querySelectorAll('.cursor').forEach(e=>e.style.left=now/D.duration*100+'%');inspect(idx);}
function frame(ts){if(last&&playing){now=Math.min(D.duration,now+(ts-last)/1000*+$('speed').value);if(now>=D.duration)playing=false;}last=ts;render();requestAnimationFrame(frame);}requestAnimationFrame(frame);window.addEventListener('resize',render);
</script></body></html>
